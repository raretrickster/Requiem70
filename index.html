<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Реквием — Telegram-бот</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #171717; color: #f5f2ed; }
    main { width: min(100%, 560px); padding: 32px; border: 1px solid #44403b; border-radius: 18px; background: #22201e; }
    .mark { color: #c8ae87; letter-spacing: .22em; font-size: 12px; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(30px, 7vw, 42px); font-weight: 600; }
    p { color: #c8c1b8; line-height: 1.65; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 18px; padding: 9px 13px; border: 1px solid #47634d; border-radius: 999px; color: #b9d8bd; font-size: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8bc795; }
    a { color: #d8bd96; }
    footer { margin-top: 26px; padding-top: 18px; border-top: 1px solid #44403b; font-size: 13px; color: #a9a198; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Ритуальное агентство</div>
    <h1>Реквием</h1>
    <p>Служебная страница Telegram-бота. Приём сообщений и заявок работает через защищённый webhook.</p>
    <div class="status"><span class="dot"></span> Серверная часть размещена на Netlify</div>
    <footer>Колпашево, ул. Победы, 14 · 8 923 415-50-00<br><a href="https://реквием.com">реквием.com</a></footer>
  </main>
</body>
</html>
